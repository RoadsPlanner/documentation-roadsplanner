site_name: Documentation RoadsPlanner
site_url: https://roadsplanner.github.io/documentation-roadsplanner/
repo_url: https://github.com/RoadsPlanner
repo_name: RoadsPlanner
nav :
  - Accueil: index.md
  - Contexte et besoins : contexte_besoin.md
  - Personas : personas.md
  - Comparatif technologique : comparatif.md
  - Choix de la technologie : technologie.md
  - RGPD : rgpd.md
  - Accessibilité : accessibilite.md
  - Organisation des dépôts : depots.md
  - Tests : tests.md
  - Suivi des tokens : suivi-tokens.md
  - Guide utilisateur:
      - Introduction: guide-utilisateur/index.md
      - Premiers pas:
          - Créer un compte: guide-utilisateur/premiers-pas/creer-un-compte.md
          - Se connecter et se déconnecter: guide-utilisateur/premiers-pas/se-connecter.md
          - Découvrir l'écran: guide-utilisateur/premiers-pas/decouvrir-l-ecran.md
          - Installer l'application: guide-utilisateur/premiers-pas/installer.md
      - Préparer un roadtrip:
          - Créer un roadtrip: guide-utilisateur/roadtrip/creer.md
          - Ajouter une étape: guide-utilisateur/roadtrip/ajouter-une-etape.md
          - Choisir où dormir: guide-utilisateur/roadtrip/hebergement.md
          - Suivre le roadtrip: guide-utilisateur/roadtrip/tableau-de-bord.md
          - Voir le trajet sur la carte: guide-utilisateur/roadtrip/carte.md
          - Modifier ou supprimer: guide-utilisateur/roadtrip/modifier-supprimer.md
      - Voyager à plusieurs:
          - Partager un roadtrip: guide-utilisateur/partage/partager.md
          - Les droits de chacun: guide-utilisateur/partage/droits.md
      - Aide:
          - Questions fréquentes: guide-utilisateur/aide/faq.md
          - Problèmes et solutions: guide-utilisateur/aide/problemes.md
          - Lexique: guide-utilisateur/aide/lexique.md
theme:
  name: material
  language: fr

  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Basculer en mode sombre
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Basculer en mode clair
markdown_extensions:
  - attr_list
  - tables
  - admonition
  - def_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - style/classes.css
  - style/extra.css
  - style/guide.css
