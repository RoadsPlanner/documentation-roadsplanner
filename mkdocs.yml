site_name: Documentation RoadsPlanner
site_url: https://roadsplanner.github.io/documentation-roadsplanner/
repo_url: https://github.com/RoadsPlanner
repo_name: RoadsPlanner
nav :
  - Accueil: index.md
  - Contexte et besoins : contexte_besoin.md
  - Personas : personas.md
  - Comparatif technologique : comparatif.md
  - Choix de la technologie : technologie.md
  - RGPD : rgpd.md
  - Accessibilité : accessibilite.md
  - Organisation des dépôts : depots.md
  - Tests : tests.md
  - Suivi des tokens : suivi-tokens.md
  - Guide utilisateur: https://roadsplanner.github.io/guide-utilisateur-roadsplanner/
theme:
  name: material
  language: fr

  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Basculer en mode sombre
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Basculer en mode clair
markdown_extensions:
  - attr_list
  - tables
  - admonition
  - def_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - style/classes.css
  - style/extra.css
